# dsh-web-search-tavily 配置示例（手工挂载 / 覆盖时复制到 profile 的 cordis.patch.yml）
#
# 说明：
# - 通过 `dsh plugin add` 安装时无需手工编辑（包内 cordis.patch.yml 自动挂载，
#   默认即下方内容）；本示例用于手工挂载或按 id 覆盖定制。
# - `apiKey` 支持 `env:VAR` 引用（密钥不落盘），也支持逗号分隔多 key 轮换：
#     apiKey: 'env:TAVILY_API_KEY,TAVILY_API_KEY_2'
# - `- id: web` 的 config 是整键替换：覆盖时必须同时带 fetchProvider: http，
#   否则 web_fetch 丢失。
- insert:
    - id: web-search-tavily
      name: dsh-web-search-tavily
      config:
        apiKey: 'env:TAVILY_API_KEY'
        searchDepth: basic        # basic | advanced（重排序，2 credits/次）
        includeAnswer: false      # true = 让 Tavily 顺带生成答案（映射到 content）
        # maxResults: 5           # 请求未带条数时的默认值
        # baseURL: https://api.tavily.com
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: tavily
    fetchProvider: http
